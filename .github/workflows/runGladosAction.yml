name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # UTC 2点00分(北京时间 10点00分), 时差8小时
    # 从 UTC 0点00分(北京时间 8点00分) 开始每隔 10 小时签到一次，防止网络问题导致的签到不上
    # - cron: 0 0/10 * * *
    # 中国时区上午6点10分进行签到，对应的UTC时区为晚上22点
    - cron: 10 22 * * *
  # 标星时触发工作流程
  watch:
    types: [started]

permissions:
  contents: write

jobs:
  checkin-job:
    name: Glados Checkin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env:
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
  keepalive-job:
    name: Keepalive Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update repository heartbeat
        shell: bash
        run: |
          day=$(date -u +%d)

          # 每月 1 日和 15 日提交一次，避免每天产生无意义提交
          if [ "$day" = "01" ] || [ "$day" = "15" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/actions-heartbeat

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .github/actions-heartbeat
            git commit -m "chore: update actions heartbeat"
            git push
          else
            echo "今天不更新 heartbeat"
          fi
